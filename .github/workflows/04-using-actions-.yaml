name: O4 - Using Actions

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install Dependencies
        run: |
          npm install --package-lock-only
          npm ci
        working-directory: react-app
      - name: Build
        run: npm run build
